<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: cv-masthead-ledger.webp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Winky+Sans:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#08080a}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-chrome-bar region chrome" data-region="chrome-bar"><!-- top export chrome back + download --></div>
  <div class="r-masthead-name region text" data-region="masthead-name"><!-- legal name display --><p style="font-size:var(--r-masthead-name-font);font-family:var(--r-masthead-name-family),sans-serif;font-weight:var(--r-masthead-name-weight);line-height:1.05;margin:0">masthead-name</p></div>
  <div class="r-masthead-role region text" data-region="masthead-role"><!-- role line cyan --><p style="font-size:var(--r-masthead-role-font);line-height:1.05;margin:0">masthead-role</p></div>
  <div class="r-masthead-blurb region text" data-region="masthead-blurb"><!-- short profile blurb --><p style="font-size:var(--r-masthead-blurb-font);line-height:1.05;margin:0">masthead-blurb</p></div>
  <div class="r-download-cta region control" data-region="download-cta"><!-- Descargar PDF button: rebuild the control's chrome from the crop (comp-spec.mjs --crop download-cta); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-ledger-header region text" data-region="ledger-header"><!-- experiencia destacada + column labels --><p style="line-height:1.05;margin:0">ledger-header</p></div>
  <div class="r-ledger-rows region text" data-region="ledger-rows"><!-- tabular experience rows date org role tech --><p style="font-size:var(--r-ledger-rows-font);line-height:1.05;margin:0">ledger-rows</p></div>
  <div class="r-skills-panel region text" data-region="skills-panel"><!-- highlighted skills categories --><p style="font-size:var(--r-skills-panel-font);line-height:1.05;margin:0">skills-panel</p></div>
  <div class="r-education-panel region text" data-region="education-panel"><!-- education + certs --><p style="font-size:var(--r-education-panel-font);line-height:1.05;margin:0">education-panel</p></div>
  <div class="r-contact-panel region text" data-region="contact-panel"><!-- contact links --><p style="font-size:var(--r-contact-panel-font);line-height:1.05;margin:0">contact-panel</p></div>
</main>
</body>
</html>
