<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: command-lattice.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#08090b}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-header-chrome region chrome" data-region="header-chrome"><!-- G-DARKO top nav bar with Profile Missions Contact More and utility icons --></div>
  <div class="r-panel-title region text" data-region="panel-title"><!-- Missions // Operations panel title --><p style="font-size:var(--r-panel-title-font);font-family:var(--r-panel-title-family),sans-serif;font-weight:var(--r-panel-title-weight);line-height:1.05;margin:0">panel-title</p></div>
  <div class="r-map-label region text" data-region="map-label"><!-- OPERATIONS MAP section stamp --><p style="font-size:var(--r-map-label-font);line-height:1.05;margin:0">map-label</p></div>
  <div class="r-node-black-sheep region control" data-region="node-black-sheep"><!-- Black Sheep Lab org node with icon ring title blurb and segment status: rebuild the control's chrome from the crop (comp-spec.mjs --crop node-black-sheep); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-node-freelance region control" data-region="node-freelance"><!-- Freelance org node with briefcase icon ring title blurb and segment status: rebuild the control's chrome from the crop (comp-spec.mjs --crop node-freelance); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-node-academia region control" data-region="node-academia"><!-- Academia org node selected with corner brackets glow graduation icon and lit segments: rebuild the control's chrome from the crop (comp-spec.mjs --crop node-academia); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-map-hint region text" data-region="map-hint"><!-- Select a node to view details hint --><p style="font-size:var(--r-map-hint-font);line-height:1.05;margin:0">map-hint</p></div>
  <div class="r-brief-header region text" data-region="brief-header"><!-- Side brief Academia header with icon title and description --><p style="font-size:var(--r-brief-header-font);line-height:1.05;margin:0">brief-header</p></div>
  <div class="r-projects-label region text" data-region="projects-label"><!-- PROJECTS label --><p style="font-size:var(--r-projects-label-font);line-height:1.05;margin:0">projects-label</p></div>
  <div class="r-project-aerial region control" data-region="project-aerial"><!-- Aerial Depot project chip row with icon title tagline segments and chevron: rebuild the control's chrome from the crop (comp-spec.mjs --crop project-aerial); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-project-tienko region control" data-region="project-tienko"><!-- Tienko project chip row: rebuild the control's chrome from the crop (comp-spec.mjs --crop project-tienko); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-project-postgrados region control" data-region="project-postgrados"><!-- Postgrados project chip row: rebuild the control's chrome from the crop (comp-spec.mjs --crop project-postgrados); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-project-yiza region control" data-region="project-yiza"><!-- YIZA project chip row: rebuild the control's chrome from the crop (comp-spec.mjs --crop project-yiza); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-mission-rail region chrome" data-region="mission-rail"><!-- Right mission navigator rail icons --></div>
  <div class="r-footer-brand region text" data-region="footer-brand"><!-- G-DARKO HOLOGRAM WORKSHOP footer mark --><p style="font-size:var(--r-footer-brand-font);line-height:1.05;margin:0">footer-brand</p></div>
  <div class="r-footer-status region chrome" data-region="footer-status"><!-- SYSTEM ONLINE status with dots --></div>
</main>
</body>
</html>
